name: Build Android demo APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-demo/**'
      - '.github/workflows/android-demo.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build debug APK
        run: gradle -p android-demo testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Verify and name the installable file
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-demo/app/build/outputs/apk/debug/app-debug.apk
          cp android-demo/app/build/outputs/apk/debug/app-debug.apk muse-demo-debug.apk
          sha256sum muse-demo-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: muse-android-demo
          path: |
            muse-demo-debug.apk
            SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
