name: muse-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: muse
      POSTGRES_PASSWORD: muse_local_dev
      POSTGRES_DB: muse
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - muse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U muse -d muse']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  muse-postgres:
